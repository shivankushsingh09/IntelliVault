{% extends "base.html" %}

{% block title %}Reset Password - IntelliVault{% endblock %}

{% block content %}
<div class="iv-auth-wrapper">
    <div class="iv-auth-card">
        <div class="iv-card">
            <!-- Header -->
            <div style="text-align:center; margin-bottom:1.75rem;">
                <div class="iv-auth-icon">
                    <i class="fas fa-key"></i>
                </div>
                <h1 class="iv-auth-title">Choose New Password</h1>
                <p class="iv-auth-subtitle">Please enter your new strong password below</p>
            </div>

            <!-- Form -->
            <form method="POST" id="resetForm">
                <div class="iv-field">
                    <label for="password" class="iv-label">New Password</label>
                    <div class="iv-password-wrap">
                        <input type="password" class="iv-input" id="password" name="password"
                            placeholder="Enter new password" required autofocus>
                        <button type="button" class="iv-password-toggle" onclick="togglePw('password', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="iv-form-hint">8+ characters, uppercase, lowercase, and numbers</div>
                </div>

                <div class="iv-field" style="margin-bottom:1.5rem;">
                    <label for="confirm_password" class="iv-label">Confirm Password</label>
                    <div class="iv-password-wrap">
                        <input type="password" class="iv-input" id="confirm_password" name="confirm_password"
                            placeholder="Confirm your password" required>
                        <button type="button" class="iv-password-toggle" onclick="togglePw('confirm_password', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="iv-btn iv-btn--primary">
                    <i class="fas fa-circle-check me-1"></i> Update Password
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function togglePw(id, btn) {
    var inp = document.getElementById(id);
    var ico = btn.querySelector('i');
    if (inp.type === 'password') {
        inp.type = 'text';
        ico.className = 'fas fa-eye-slash';
    } else {
        inp.type = 'password';
        ico.className = 'fas fa-eye';
    }
}

document.getElementById('resetForm').addEventListener('submit', function(e) {
    var password = document.getElementById('password').value;
    var confirm = document.getElementById('confirm_password').value;
    
    if (password !== confirm) {
        e.preventDefault();
        alert('Passwords do not match');
        return;
    }
    
    if (password.length < 8) {
        e.preventDefault();
        alert('Password must be at least 8 characters long');
        return;
    }
    
    if (!/[A-Z]/.test(password)) {
        e.preventDefault();
        alert('Password must contain at least one uppercase letter');
        return;
    }
    
    if (!/[a-z]/.test(password)) {
        e.preventDefault();
        alert('Password must contain at least one lowercase letter');
        return;
    }
    
    if (!/[0-9]/.test(password)) {
        e.preventDefault();
        alert('Password must contain at least one digit');
        return;
    }
});
</script>
{% endblock %}
