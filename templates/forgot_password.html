{% extends "base.html" %}

{% block title %}Forgot Password - IntelliVault{% endblock %}

{% block content %}
<div class="iv-auth-wrapper">
    <div class="iv-auth-card">
        <div class="iv-card">
            <!-- Header -->
            <div style="text-align:center; margin-bottom:1.75rem;">
                <div class="iv-auth-icon">
                    <i class="fas fa-shield-halved"></i>
                </div>
                <h1 class="iv-auth-title">Reset Password</h1>
                <p class="iv-auth-subtitle">Enter your email address to receive a recovery link</p>
            </div>

            <!-- Form -->
            <form method="POST">
                <div class="iv-field">
                    <label for="email" class="iv-label">Email Address</label>
                    <input type="email" class="iv-input" id="email" name="email"
                        placeholder="Enter your email address" required autofocus>
                </div>

                <button type="submit" class="iv-btn iv-btn--primary" style="margin-top:0.5rem;">
                    <i class="fas fa-paper-plane me-1"></i> Send Recovery Link
                </button>
            </form>

            <!-- Footer -->
            <div class="iv-auth-footer" style="margin-top:1.5rem;">
                Remember your password? <a href="{{ url_for('auth.login') }}" class="iv-link">Sign In</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
